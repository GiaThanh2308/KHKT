<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quản lý học sinh</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="stylesheet" href="css/students.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="layout">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div class="logo">
          <i class="fa-solid fa-school"></i>

          <span>AI School</span>
        </div>

        <ul class="menu">
          <li>
            <i class="fa-solid fa-chart-line"></i>
            Dashboard
          </li>

          <li class="active">
            <i class="fa-solid fa-user-graduate"></i>
            Học sinh
          </li>

          <li>
            <i class="fa-solid fa-camera"></i>
            Nhận diện khuôn mặt
          </li>

          <li>
            <i class="fa-solid fa-car"></i>
            Nhận diện biển số
          </li>

          <li>
            <i class="fa-solid fa-robot"></i>
            Chatbot AI
          </li>
        </ul>
      </aside>

      <!-- Main -->

      <main class="main">
        <!-- Topbar -->

        <header class="topbar">
          <div>
            <h1>Quản lý học sinh</h1>

            <p>Danh sách và thông tin học sinh</p>
          </div>

          <button class="add-btn" onclick="openModal()">
            <i class="fa-solid fa-plus"></i>
            Thêm học sinh
          </button>
        </header>

        <!-- Stats -->

        <section class="stats">
          <div class="stat-card student">
            <div class="card-header">
              <span>Tổng học sinh</span>

              <i class="fa-solid fa-user-graduate"></i>
            </div>

            <h2 id="studentCount">0</h2>
          </div>

          <div class="stat-card face">
            <div class="card-header">
              <span>Đã có khuôn mặt</span>

              <i class="fa-solid fa-face-smile"></i>
            </div>

            <h2>0</h2>
          </div>

          <div class="stat-card plate">
            <div class="card-header">
              <span>Lớp học</span>

              <i class="fa-solid fa-school"></i>
            </div>

            <h2>0</h2>
          </div>
        </section>

        <!-- Search -->

        <section class="search-section">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              type="text"
              placeholder="Tìm kiếm học sinh..."
              id="searchInput"
            />
          </div>
        </section>

        <!-- Table -->

        <section class="table-card">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Mã HS</th>
                <th>Họ tên</th>
                <th>Lớp</th>
                <th>Hành động</th>
              </tr>
            </thead>

            <tbody id="studentTable">
              <!-- render bằng JS -->
            </tbody>
          </table>
        </section>
      </main>

      <!-- Mobile Nav -->

      <nav class="mobile-nav">
        <div class="mobile-item">
          <i class="fa-solid fa-camera"></i>
          <span>Face</span>
        </div>

        <div class="mobile-item active">
          <i class="fa-solid fa-user-graduate"></i>
          <span>Students</span>
        </div>

        <div class="mobile-item">
          <i class="fa-solid fa-robot"></i>
          <span>AI</span>
        </div>

        <div class="mobile-item">
          <i class="fa-solid fa-user"></i>
          <span>Profile</span>
        </div>
      </nav>
    </div>
    <div class="modal" id="studentModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Thêm học sinh</h2>

          <button class="close-btn" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="form-group">
          <label>Mã học sinh</label>

          <input type="text" id="studentCode" />
        </div>

        <div class="form-group">
          <label>Họ tên</label>

          <input type="text" id="fullName" />
        </div>

        <div class="form-group">
          <label>Lớp</label>

          <input type="text" id="className" />
        </div>

        <div class="form-group">
          <label>Face Label</label>

          <input type="text" id="faceLabel" />
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>

          <input type="text" id="phone" />
        </div>

        <div class="form-group">
          <label>SĐT phụ huynh</label>

          <input type="text" id="parentPhone" />
        </div>

        <button class="save-btn" onclick="createStudent()">Lưu học sinh</button>
      </div>
    </div>
    <script src="js/students.js"></script>
  </body>
</html>
